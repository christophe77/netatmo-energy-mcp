<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">netatmo-energy-mcp architecture</title>
  <desc id="desc">An AI assistant talks to the local netatmo-energy-mcp process over stdio. Inside, MCP tools call application services, which use the Netatmo client (read-only unless write mode is enabled and each change is confirmed); the client gets tokens from the auth module, which stores credentials in an owner-only file. Only HTTPS requests to api.netatmo.com leave the machine.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #F3F7F7; stroke: #9FB8B8; stroke-width: 1.5; }
    .proc { fill: none; stroke: #0E3B43; stroke-width: 2; stroke-dasharray: 6 5; }
    .accent { fill: #FFF4E8; stroke: #F59E42; stroke-width: 1.5; }
    .ext { fill: #E8F1F8; stroke: #7FA6C4; stroke-width: 1.5; }
    .h { fill: #0E3B43; font-size: 15px; font-weight: 600; }
    .t { fill: #2D4A4A; font-size: 12.5px; }
    .lbl { fill: #4F6B6B; font-size: 12px; }
    .line { stroke: #4F6B6B; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .both { marker-start: url(#arrow-s); }
    .arrowhead { fill: #4F6B6B; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0D1117; }
      .box { fill: #161B22; stroke: #3D5A5A; }
      .proc { stroke: #5FB3A6; }
      .accent { fill: #2A1F12; stroke: #F59E42; }
      .ext { fill: #13202C; stroke: #4C7898; }
      .h { fill: #D7EDEA; }
      .t { fill: #B8CDCB; }
      .lbl { fill: #9DB3B1; }
      .line { stroke: #9DB3B1; }
      .arrowhead { fill: #9DB3B1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M10,0 L0,5 L10,10 z"/></marker>
  </defs>
  <rect class="bg" width="980" height="400"/>

  <!-- Assistant -->
  <rect class="ext" x="16" y="140" width="160" height="110" rx="12"/>
  <text class="h" x="96" y="175" text-anchor="middle">AI assistant</text>
  <text class="t" x="96" y="198" text-anchor="middle">Claude Desktop</text>
  <text class="t" x="96" y="216" text-anchor="middle">Claude Code · Cursor</text>
  <text class="t" x="96" y="234" text-anchor="middle">any MCP client</text>

  <path class="line both" d="M178,195 L258,195"/>
  <text class="lbl" x="218" y="184" text-anchor="middle">stdio</text>
  <text class="lbl" x="218" y="214" text-anchor="middle">JSON-RPC</text>

  <!-- Local process -->
  <rect class="proc" x="262" y="20" width="470" height="360" rx="16"/>
  <text class="h" x="282" y="46">netatmo-energy-mcp (local process)</text>

  <rect class="box" x="282" y="62" width="430" height="64" rx="10"/>
  <text class="h" x="302" y="88">MCP layer</text>
  <text class="t" x="302" y="110">14 tools · 4 resources · 4 prompts · schemas · structured errors</text>

  <path class="line" d="M497,126 L497,142"/>

  <rect class="box" x="282" y="144" width="430" height="64" rx="10"/>
  <text class="h" x="302" y="170">Application services</text>
  <text class="t" x="302" y="192">EnergyService · AnalyticsService (deterministic, no LLM)</text>

  <path class="line" d="M587,208 L587,224"/>

  <!-- Auth (left) and Netatmo client (right) -->
  <rect class="accent" x="282" y="226" width="170" height="84" rx="10"/>
  <text class="h" x="298" y="252">Auth</text>
  <text class="t" x="298" y="273">OAuth2 login</text>
  <text class="t" x="298" y="291">rotation-safe refresh</text>

  <rect class="box" x="472" y="226" width="240" height="84" rx="10"/>
  <text class="h" x="488" y="252">Netatmo client</text>
  <text class="t" x="488" y="273">4 allow-listed read endpoints</text>
  <text class="t" x="488" y="291">rate limiter · retries · validation</text>

  <path class="line" d="M472,268 L454,268"/>
  <text class="lbl" x="462" y="324" text-anchor="middle">tokens</text>

  <path class="line" d="M367,310 L367,334"/>
  <rect class="accent" x="282" y="336" width="170" height="34" rx="8"/>
  <text class="t" x="367" y="358" text-anchor="middle">credentials.json (owner-only)</text>

  <!-- Netatmo -->
  <path class="line" d="M712,268 L802,268"/>
  <text class="lbl" x="740" y="258">HTTPS</text>
  <text class="lbl" x="740" y="288">read-only</text>
  <text class="lbl" x="740" y="303">by default</text>

  <rect class="ext" x="806" y="200" width="158" height="136" rx="12"/>
  <text class="h" x="885" y="234" text-anchor="middle">Netatmo API</text>
  <text class="t" x="885" y="258" text-anchor="middle">api.netatmo.com</text>
  <text class="t" x="885" y="282" text-anchor="middle">homesdata · homestatus</text>
  <text class="t" x="885" y="300" text-anchor="middle">getroommeasure</text>
  <text class="t" x="885" y="318" text-anchor="middle">getmeasure</text>

  <text class="lbl" x="885" y="370" text-anchor="middle">No telemetry · no other hosts</text>
</svg>
