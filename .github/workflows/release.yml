name: Release

# Manual only, two human approvals per release (see docs/releasing.md):
#   1. GitHub: the "npm" environment requires a reviewer and only deploys from main.
#   2. npm: the trusted publisher may only *stage* a version (OIDC, no token); it goes live
#      after the maintainer approves it with 2FA (npm stage approve / npmjs.com).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build, validate and `npm stage publish --dry-run`, no upload)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Stage on npm (${{ inputs.dry_run && 'dry run' || 'LIVE' }})
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance: no long-lived npm token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm >= 11.5.1
        run: npm install -g --ignore-scripts npm@11.21.0
      # No dependency lifecycle scripts in the job that can mint publish credentials.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm dlx publint@0.3.25 --strict
      - run: pnpm check:package
      - name: Refuse to publish a private or unversioned package
        if: ${{ !inputs.dry_run }}
        run: |
          node -e "
            const p = require('./package.json');
            if (p.private) { console.error('package.json is private'); process.exit(1); }
            if (p.version === '0.0.0') { console.error('version not set'); process.exit(1); }
          "
      - name: Stage the version on npm (goes live only after maintainer approval with 2FA)
        run: npm stage publish --access public --provenance ${{ inputs.dry_run && '--dry-run' || '' }}
