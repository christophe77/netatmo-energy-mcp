name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit, integration and MCP protocol tests (with coverage thresholds)
        run: pnpm test:coverage
      - run: pnpm build
      - name: Smoke test the built CLI
        run: node dist/index.js --version

  package:
    name: Package validation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lint package metadata
        run: pnpm dlx publint@0.3.25 --strict
      - name: Tool reference (docs/tools.md) matches the server
        run: pnpm docs:check
      - name: Pack, install and talk MCP to the installed binary
        run: pnpm check:package
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level high

  remote:
    name: Remote server (Cloudflare Worker)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Worker dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
        working-directory: remote
      - name: Typecheck the Worker and the shared core under Workers types
        run: npx tsc --noEmit
        working-directory: remote
      - name: End to end against the local Workers emulator and a fake Netatmo
        run: node remote/test/e2e.mjs
        timeout-minutes: 10
      - name: Dependency audit (Worker, production)
        run: npm audit --omit=dev --audit-level=high
        working-directory: remote
